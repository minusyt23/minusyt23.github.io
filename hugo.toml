baseURL = 'https://minus.my.id/'
languageCode = 'en-us'
title = 'Minus Space'

enableRobotsTXT = true
enableInlineShortcodes = true

[outputs]
  home = ['HTML']
  page = ['HTML']
  section = ['HTML', 'RSS']

[module]
  [module.hugoVersion]
    extended = true
    min = '0.124.0'
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Sidebar links (rendered by the theme inside the sidebar itself)
[[menu.sidebar]]
  identifier = 'home'
  name = 'Home'
  url = '/'
  weight = 1

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.page]
    width = 'normal'

  [params.theme]
    default = 'system'
    displayToggle = true

  [params.footer]
    enable = false

  [params.blog]
    [params.blog.list]
      displayTags = true

  [params.search]
    enable = false
