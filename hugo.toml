baseURL = 'https://minus.my.id/'
languageCode = 'en-us'
title = 'Minus Space'

enableRobotsTXT = true
enableInlineShortcodes = true
hasCJKLanguage = false

[outputs]
  home = ['HTML']
  page = ['HTML']
  section = ['HTML', 'RSS']

[module]
  [module.hugoVersion]
    extended = true
    min = '0.124.0'
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Navigation bar
[[menu.main]]
  identifier = 'docs'
  name = 'Docs'
  pageRef = '/docs'
  weight = 1

[[menu.main]]
  identifier = 'blog'
  name = 'Blog'
  pageRef = '/blog'
  weight = 2

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  weight = 3
  [menu.main.params]
    type = 'search'

[[menu.main]]
  identifier = 'github'
  name = 'GitHub'
  url = 'https://github.com/minusyt23'
  weight = 4
  [menu.main.params]
    icon = 'github'

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.page]
    width = 'normal'

  [params.theme]
    default = 'system'
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = true
    width = 'normal'

  [params.blog]
    [params.blog.list]
      displayTags = true

  [params.search]
    enable = true
    type = 'flexsearch'
    [params.search.flexsearch]
      index = 'content'
      tokenize = 'forward'
